services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - heritage_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      PORT: 4000
      MONGO_URL: mongodb://mongo:27017/heritage
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "4000:4000"

  web:
    build: ./client
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  heritage_mongo:
